<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCCDM Expense Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; }
    .active-tab { background: #00ff66 !important; color: #000 !important; font-weight: bold; }
  </style>
</head>
<body class="p-4">

  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div id="topHeader" class="hidden flex justify-between items-center bg-zinc-900 p-3 rounded-lg mb-4 border border-zinc-800">
      <span id="whoAmI" class="text-xs text-green-400 font-bold"></span>
      <button onclick="doLogout()" class="bg-red-800 text-white px-3 py-1 rounded text-xs">Logout</button>
    </div>

    <!-- Login Box -->
    <div id="loginCard" class="max-w-md mx-auto bg-zinc-900 p-6 rounded-xl border border-zinc-800 mt-12">
      <h2 class="text-center font-bold text-lg mb-4">DCCDM Login</h2>
      <div class="grid grid-cols-2 gap-2 bg-zinc-950 p-1 rounded-lg mb-4">
        <button type="button" id="btnStaff" onclick="switchRole('staff')" class="active-tab py-2 text-xs rounded">Staff</button>
        <button type="button" id="btnAdmin" onclick="switchRole('admin')" class="py-2 text-xs rounded text-zinc-400">Admin</button>
      </div>
      <input type="email" id="loginEmail" placeholder="Email" class="w-full p-2.5 bg-zinc-950 border border-zinc-700 rounded mb-3 text-sm text-white">
      <input type="password" id="loginPass" placeholder="Password" class="w-full p-2.5 bg-zinc-950 border border-zinc-700 rounded mb-4 text-sm text-white">
      <button onclick="doLogin()" class="w-full bg-[#00ff66] text-black font-bold py-2.5 rounded text-sm">Sign In</button>
    </div>

    <!-- Main Content -->
    <div id="mainDashboard" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Form -->
      <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 h-fit">
        <h3 class="font-bold text-sm mb-3 text-green-400">Add Voucher</h3>
        <input type="date" id="vDate" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded mb-2 text-xs text-white">
        <input type="number" id="vAmt" placeholder="Amount (₹)" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded mb-2 text-xs text-white">
        <input type="text" id="vSpent" placeholder="Spent By" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded mb-2 text-xs text-white">
        <input type="text" id="vPaid" placeholder="Paid To" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded mb-2 text-xs text-white">
        <input type="file" id="vFile" class="w-full text-xs mb-3 text-zinc-400">
        <button onclick="saveVoucher()" class="w-full bg-[#00ff66] text-black font-bold py-2 rounded text-xs">Save Voucher</button>
      </div>

      <!-- Table -->
      <div class="md:col-span-2 bg-zinc-900 p-4 rounded-xl border border-zinc-800">
        <h3 class="font-bold text-sm mb-3">Voucher List</h3>
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="text-zinc-500 border-b border-zinc-800">
              <th class="p-2">ID</th>
              <th class="p-2">Spent By</th>
              <th class="p-2">Amount</th>
              <th class="p-2 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="dataTable" class="divide-y divide-zinc-800"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Supabase v2 ESM Import (Invalid API Key Error Fix) -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://vtzcwmqiyuqmzgwctuut.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0emN3bXFpeXVxbXpnd2N0dXV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDA3NTAsImV4cCI6MjEwMTc3Njc1MH0.VC8xy-Rfxva1oY8vW4WXpE1YSPspx2aYdh110SZiE2k';
    
    const _db = createClient(SUPABASE_URL, SUPABASE_KEY);
    window._db = _db; // Global access for inline onclick events
  </script>

  <script>
    let activeRole = 'staff';
    let currentUser = null;

    document.getElementById('vDate').value = new Date().toISOString().split('T')[0];

    function switchRole(role) {
      activeRole = role;
      document.getElementById('btnStaff').classList.toggle('active-tab', role === 'staff');
      document.getElementById('btnAdmin').classList.toggle('active-tab', role === 'admin');
    }

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;

      if (!email || !pass) return alert("Please fill all fields");

      const { data, error } = await window._db.auth.signInWithPassword({ email, password: pass });
      if (error) return alert("Login Failed: " + error.message);

      const { data: profile } = await window._db.from('profiles').select('*').eq('id', data.user.id).single();

      if (activeRole === 'admin' && profile?.role !== 'admin') {
        await window._db.auth.signOut();
        return alert("Access Denied! You are not an Admin.");
      }

      currentUser = data.user;
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('topHeader').classList.remove('hidden');
      document.getElementById('mainDashboard').classList.remove('hidden');
      document.getElementById('whoAmI').innerText = `Logged in as: ${data.user.email} (${activeRole.toUpperCase()})`;

      loadRecords();
    }

    async function saveVoucher() {
      const vId = 'DCCDM-' + Math.floor(1000 + Math.random() * 9000);
      const fileInput = document.getElementById('vFile');
      let fileUrl = null;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fName = `${Date.now()}_${file.name}`;
        const { error: upErr } = await window._db.storage.from('vouchers').upload(fName, file);
        if (!upErr) {
          const { data: pubData } = window._db.storage.from('vouchers').getPublicUrl(fName);
          fileUrl = pubData.publicUrl;
        }
      }

      const { error: insErr } = await window._db.from('expenses').insert([{
        voucher_id: vId,
        expense_date: document.getElementById('vDate').value,
        amount: parseFloat(document.getElementById('vAmt').value),
        spent_by: document.getElementById('vSpent').value.trim(),
        paid_to: document.getElementById('vPaid').value.trim(),
        attachment_url: fileUrl,
        created_by: currentUser.id
      }]);

      if (insErr) alert("Error: " + insErr.message);
      else {
        alert("Voucher Saved!");
        document.getElementById('vAmt').value = '';
        document.getElementById('vSpent').value = '';
        document.getElementById('vPaid').value = '';
        document.getElementById('vFile').value = '';
        loadRecords();
      }
    }

    async function loadRecords() {
      const { data, error } = await window._db.from('expenses').select('*').order('created_at', { ascending: false });
      if (error) return;

      const tbody = document.getElementById('dataTable');
      tbody.innerHTML = '';

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-zinc-500">No data found</td></tr>`;
        return;
      }

      data.forEach(item => {
        tbody.innerHTML += `
          <tr class="hover:bg-zinc-800/50">
            <td class="p-2 font-mono text-green-400">${item.voucher_id}</td>
            <td class="p-2">${item.spent_by}</td>
            <td class="p-2">₹${item.amount}</td>
            <td class="p-2 text-center flex justify-center gap-2">
              ${item.attachment_url ? `<a href="${item.attachment_url}" target="_blank" class="text-blue-400"><i class="fa fa-download"></i></a>` : ''}
              ${activeRole === 'admin' ? `<button onclick="removeVoucher(${item.id})" class="text-red-400"><i class="fa fa-trash"></i></button>` : ''}
            </td>
          </tr>
        `;
      });
    }

    async function removeVoucher(id) {
      if (activeRole !== 'admin') return alert("Admin only!");
      if (confirm("Delete this record?")) {
        const { error } = await window._db.from('expenses').delete().eq('id', id);
        if (error) alert("Failed: " + error.message);
        else loadRecords();
      }
    }

    async function doLogout() {
      await window._db.auth.signOut();
      location.reload();
    }
  </script>
</body>
</html>
