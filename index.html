<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCCDM Expense Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white p-5">

  <div id="authBox" class="max-w-sm mx-auto bg-zinc-900 p-6 rounded-xl border border-zinc-800">
    <h2 class="text-center font-bold mb-4">Login</h2>
    <select id="roleSelect" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded mb-4 text-black">
      <option value="staff">Staff Login</option>
      <option value="admin">Admin Login</option>
    </select>
    <input type="email" id="email" placeholder="Email" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded mb-2 text-sm">
    <input type="password" id="pass" placeholder="Password" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded mb-4 text-sm">
    <button id="loginBtn" class="w-full bg-green-500 text-black font-bold py-2 rounded">Login</button>
  </div>

  <div id="dash" class="hidden max-w-4xl mx-auto">
    <button onclick="location.reload()" class="bg-red-800 px-4 py-2 rounded text-xs mb-4">Logout</button>
    <div class="bg-zinc-900 p-5 rounded-xl border border-zinc-800">
      <table class="w-full text-left">
        <thead><tr class="text-zinc-500 text-xs"><th>ID</th><th>Spent By</th><th>Amount</th><th>Action</th></tr></thead>
        <tbody id="tbody" class="text-sm"></tbody>
      </table>
    </div>
  </div>

  <script>
    const supabase = supabase.createClient('https://vtzcwmqiyuqmzgwctuut.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.VC8xy-Rfxva1oY8vW4WXpE1YSPspx2aYdh110SZiE2k');
    
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      const role = document.getElementById('roleSelect').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
      if (error) return alert(error.message);
      
      const { data: profile } = await supabase.from('profiles').select('role').eq('id', data.user.id).single();
      
      if (role === 'admin' && profile?.role !== 'admin') return alert("Access Denied! Not an Admin.");
      
      document.getElementById('authBox').classList.add('hidden');
      document.getElementById('dash').classList.remove('hidden');
      loadData(role);
    });

    async function loadData(role) {
      const { data } = await supabase.from('expenses').select('*');
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      data.forEach(i => {
        tbody.innerHTML += `
          <tr class="border-t border-zinc-800">
            <td class="p-2">${i.voucher_id}</td>
            <td class="p-2">${i.spent_by}</td>
            <td class="p-2">₹${i.amount}</td>
            <td class="p-2">
              ${role === 'admin' ? `<button onclick="del(${i.id})" class="text-red-500 text-xs">Delete</button>` : 'Staff'}
            </td>
          </tr>
        `;
      });
    }

    async function del(id) {
      await supabase.from('expenses').delete().eq('id', id);
      alert("Deleted!");
      loadData('admin');
    }
  </script>
</body>
</html>
