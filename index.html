<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCCDM - Expense & Voucher Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS for Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { background: #050505; color: #f4f4f5; font-family: sans-serif; }
    .bg-neon { background-color: #00ff66; }
    .text-neon { color: #00ff66; }
    .border-neon { border-color: #00ff66; }
    .active-role { background-color: #00ff66 !important; color: #000 !important; font-weight: bold; }
  </style>
</head>
<body class="p-4 min-h-screen">

  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <header class="flex justify-between items-center border-b border-zinc-800 pb-4 mb-6">
      <h1 class="text-lg font-bold text-white tracking-wide">DCCDM EXPENSE MANAGER</h1>
      <div id="userHeader" class="hidden text-xs text-zinc-400 flex items-center gap-3">
        <span id="userInfo" class="text-neon font-semibold"></span>
        <button id="logoutBtn" class="bg-red-900/80 hover:bg-red-800 text-white px-3 py-1.5 rounded transition">Logout</button>
      </div>
    </header>

    <!-- Auth Box -->
    <div id="authBox" class="max-w-md mx-auto bg-zinc-900 p-6 rounded-xl border border-zinc-800 shadow-xl mt-10">
      <h2 class="text-center font-bold text-white text-base mb-4">Portal Login</h2>
      <div class="grid grid-cols-2 gap-2 bg-zinc-950 p-1 rounded-lg mb-5 border border-zinc-800">
        <button id="staffRoleBtn" type="button" class="py-2 text-xs rounded text-zinc-400 active-role">Staff Portal</button>
        <button id="adminRoleBtn" type="button" class="py-2 text-xs rounded text-zinc-400">Admin Portal</button>
      </div>
      <div class="space-y-3">
        <input type="email" id="emailInput" placeholder="Enter Email" class="w-full p-2.5 bg-zinc-950 border border-zinc-700 rounded text-sm text-white focus:outline-none focus:border-neon">
        <input type="password" id="passInput" placeholder="Enter Password" class="w-full p-2.5 bg-zinc-950 border border-zinc-700 rounded text-sm text-white focus:outline-none focus:border-neon">
        <button id="loginBtn" class="w-full bg-neon text-black font-bold py-2.5 rounded text-sm hover:opacity-90 transition shadow-lg">Sign In</button>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashBox" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Left: Entry Form -->
      <div class="lg:col-span-4 bg-zinc-900 p-5 rounded-xl border border-zinc-800 h-fit">
        <h3 class="font-bold text-white text-sm mb-4 border-b border-zinc-800 pb-2">New Voucher Entry</h3>
        <form id="expenseForm" class="space-y-3 text-xs">
          <div>
            <label class="text-zinc-400 mb-1 block">Date</label>
            <input type="date" id="expDate" required class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded text-white">
          </div>
          <div>
            <label class="text-zinc-400 mb-1 block">Amount (₹)</label>
            <input type="number" step="0.01" id="expAmt" required placeholder="0.00" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded text-white">
          </div>
          <div>
            <label class="text-zinc-400 mb-1 block">Category</label>
            <select id="expCat" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded text-white">
              <option value="Office Supplies">Office Supplies</option>
              <option value="Travel & Transport">Travel & Transport</option>
              <option value="Food & Refreshment">Food & Refreshment</option>
              <option value="Utility Bills">Utility Bills</option>
              <option value="Others">Others</option>
            </select>
          </div>
          <div>
            <label class="text-zinc-400 mb-1 block">Spent By</label>
            <input type="text" id="expSpent" required placeholder="Person name" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded text-white">
          </div>
          <div>
            <label class="text-zinc-400 mb-1 block">Paid To</label>
            <input type="text" id="expPaid" required placeholder="Vendor name" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded text-white">
          </div>
          <div>
            <label class="text-zinc-400 mb-1 block">Attachment (Optional)</label>
            <input type="file" id="expFile" class="w-full text-zinc-400 text-xs">
          </div>
          <button type="submit" id="saveBtn" class="w-full bg-neon text-black font-bold py-2.5 rounded mt-2 hover:opacity-90 transition">Save Voucher</button>
        </form>
      </div>

      <!-- Right: Records Table -->
      <div class="lg:col-span-8 bg-zinc-900 p-5 rounded-xl border border-zinc-800">
        <div class="flex justify-between items-center mb-4 border-b border-zinc-800 pb-2">
          <h3 class="font-bold text-white text-sm">Voucher Records</h3>
          <button id="excelBtn" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded text-xs font-semibold transition">Export Excel</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead>
              <tr class="text-zinc-500 border-b border-zinc-800">
                <th class="p-2">Voucher ID</th>
                <th class="p-2">Date</th>
                <th class="p-2">Spent By</th>
                <th class="p-2 text-right">Amount</th>
                <th class="p-2 text-center">Action</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-zinc-800 text-zinc-300">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Supabase Initialization
    const SUPABASE_URL = 'https://vtzcwmqiyuqmzgwctuut.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.VC8xy-Rfxva1oY8vW4WXpE1YSPspx2aYdh110SZiE2k';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedRole = 'staff';
    let loggedUser = null;
    let allExpenses = [];

    // Role Switcher
    document.getElementById('staffRoleBtn').addEventListener('click', () => {
      selectedRole = 'staff';
      document.getElementById('staffRoleBtn').classList.add('active-role');
      document.getElementById('adminRoleBtn').classList.remove('active-role');
    });

    document.getElementById('adminRoleBtn').addEventListener('click', () => {
      selectedRole = 'admin';
      document.getElementById('adminRoleBtn').classList.add('active-role');
      document.getElementById('staffRoleBtn').classList.remove('active-role');
    });

    // Default Date to Today
    document.getElementById('expDate').value = new Date().toISOString().split('T')[0];

    // Login Handler
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passInput').value;

      if (!email || !password) return alert("Please fill in email and password.");

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return alert("Login Failed: " + error.message);

      // Check profile role
      const { data: profile, profileErr } = await supabase.from('profiles').select('role, full_name').eq('id', data.user.id).single();
      
      if (selectedRole === 'admin' && profile?.role !== 'admin') {
        await supabase.auth.signOut();
        return alert("Access Denied! You do not have Admin privileges.");
      }

      loggedUser = data.user;
      document.getElementById('authBox').classList.add('hidden');
      document.getElementById('dashBox').classList.remove('hidden');
      document.getElementById('userHeader').classList.remove('hidden');
      document.getElementById('userInfo').innerText = `${profile?.full_name || data.user.email} (${selectedRole.toUpperCase()})`;

      loadExpenses();
    });

    // Logout Handler
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      location.reload();
    });

    // Save Expense Handler
    document.getElementById('expenseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.innerText = "Saving...";
      saveBtn.disabled = true;

      const vId = 'DCCDM-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000);
      const fileInput = document.getElementById('expFile');
      let attachmentUrl = null;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
        const { error: uploadError } = await supabase.storage.from('vouchers').upload(fileName, file);
        
        if (!uploadError) {
          const { data: urlData } = supabase.storage.from('vouchers').getPublicUrl(fileName);
          attachmentUrl = urlData.publicUrl;
        }
      }

      const { error: insertError } = await supabase.from('expenses').insert([{
        voucher_id: vId,
        expense_date: document.getElementById('expDate').value,
        amount: parseFloat(document.getElementById('expAmt').value),
        category: document.getElementById('expCat').value,
        spent_by: document.getElementById('expSpent').value.trim(),
        paid_to: document.getElementById('expPaid').value.trim(),
        attachment_url: attachmentUrl,
        created_by: loggedUser.id
      }]);

      if (insertError) {
        alert("Error saving voucher: " + insertError.message);
      } else {
        alert("Voucher Saved Successfully!");
        document.getElementById('expenseForm').reset();
        document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
        loadExpenses();
      }

      saveBtn.innerText = "Save Voucher";
      saveBtn.disabled = false;
    });

    // Load Expenses Table
    async function loadExpenses() {
      const { data, error } = await supabase.from('expenses').select('*').order('created_at', { ascending: false });
      if (error) {
        console.error(error);
        return;
      }

      allExpenses = data || [];
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (allExpenses.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-zinc-500">No records found.</td></tr>`;
        return;
      }

      allExpenses.forEach(item => {
        tbody.innerHTML += `
          <tr class="hover:bg-zinc-800/40 transition">
            <td class="p-2 font-mono text-neon font-bold">${item.voucher_id}</td>
            <td class="p-2">${item.expense_date}</td>
            <td class="p-2">${item.spent_by}</td>
            <td class="p-2 text-right font-bold">₹${Number(item.amount).toFixed(2)}</td>
            <td class="p-2 text-center flex justify-center gap-2">
              ${item.attachment_url ? `<a href="${item.attachment_url}" target="_blank" title="Download File" class="text-blue-400 hover:text-blue-300"><i class="fa fa-download"></i></a>` : ''}
              ${selectedRole === 'admin' ? `<button onclick="deleteVoucher(${item.id}, '${item.voucher_id}')" title="Delete Voucher" class="text-red-400 hover:text-red-300"><i class="fa fa-trash"></i></button>` : ''}
            </td>
          </tr>
        `;
      });
    }

    // Delete Voucher (Admin Only)
    async function deleteVoucher(id, vId) {
      if (selectedRole !== 'admin') {
        alert("Unauthorized action!");
        return;
      }

      if (confirm(`Are you sure you want to delete Voucher ${vId}?`)) {
        const { error } = await supabase.from('expenses').delete().eq('id', id);
        if (error) {
          alert("Delete failed: " + error.message);
        } else {
          alert("Voucher deleted successfully.");
          loadExpenses();
        }
      }
    }

    // Export Excel
    document.getElementById('excelBtn').addEventListener('click', () => {
      if (allExpenses.length === 0) return alert("No data available to export.");
      const ws = XLSX.utils.json_to_sheet(allExpenses);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Expenses");
      XLSX.writeFile(wb, "DCCDM_Expenses.xlsx");
    });
  </script>
</body>
</html>
